services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adorchestrator
      POSTGRES_USER: ado
      POSTGRES_PASSWORD: ado_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ado -d adorchestrator"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s

  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=ado
      - POSTGRES_PWD=ado_secret
      - POSTGRES_SEEDS=db
    depends_on:
      db:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  mock-platforms:
    build: ./mock_platforms
    ports:
      - "8090:8090"
    environment:
      - CHAOS_RATE_LIMIT_PCT=0.15
      - CHAOS_SERVER_ERROR_PCT=0.08
      - CHAOS_TIMEOUT_PCT=0.05

  api:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      temporal:
        condition: service_started

  celery-worker:
    build: .
    command: celery -A workers.celery_app worker -l info -c 4
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A workers.celery_app beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  temporal-worker:
    build: .
    command: python -m workflows.worker
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - temporal
      - mock-platforms

volumes:
  pgdata:
